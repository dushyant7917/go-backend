name: Process New Billing Cycles

on:
  # Triggered externally on schedule via cron-job.org — GitHub's native `schedule:`
  # trigger was delayed by 1-10h and has been removed. See CRON_SCHEDULE.md.
  # Cron-job.org schedule: "15 20 * * *" (1:45 AM IST), "30 21 * * *" (3:00 AM IST),
  # "45 22 * * *" (4:15 AM IST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  process-new-billing-cycles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run process new billing cycles job (Cron A)
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cd cron-jobs/process_new_billing_cycles
          go run main.go

      - name: Notify on failure
        if: failure()
        run: |
          echo "Process new billing cycles job failed"
          echo "Check the logs above for details"
