name: Parse News RSS

on:
  workflow_dispatch: # Disabled scheduled runs; manual trigger only

jobs:
  parse-news-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run RSS news parser
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          R2_DS_NEWS_BUCKET_NAME: ${{ secrets.R2_DS_NEWS_BUCKET_NAME }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # If a variable is unset, the code falls back to its default (true / 0.90 / 48).
          SEMANTIC_DEDUP_ENABLED: ${{ vars.SEMANTIC_DEDUP_ENABLED }}
          SEMANTIC_DEDUP_THRESHOLD: ${{ vars.SEMANTIC_DEDUP_THRESHOLD }}
          SEMANTIC_DEDUP_WINDOW_HOURS: ${{ vars.SEMANTIC_DEDUP_WINDOW_HOURS }}
        run: |
          cd cron-jobs/parse_news_rss
          go run main.go

      - name: Notify on failure
        if: failure()
        run: |
          echo "RSS news parser failed"
          echo "Check the logs above for details"
