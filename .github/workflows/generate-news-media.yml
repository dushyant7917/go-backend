name: Generate News Media

on:
  workflow_dispatch: # Disabled scheduled runs; manual trigger only

jobs:
  generate-news-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run generate news media
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          MODAL_ENQUEUE_URL: ${{ secrets.MODAL_ENQUEUE_URL }}
          MODAL_PROXY_AUTH_TOKEN_ID: ${{ secrets.MODAL_PROXY_AUTH_TOKEN_ID }}
          MODAL_PROXY_AUTH_TOKEN_SECRET: ${{ secrets.MODAL_PROXY_AUTH_TOKEN_SECRET }}
        run: |
          cd cron-jobs/generate_news_media
          go run main.go

      - name: Notify on failure
        if: failure()
        run: |
          echo "Generate news media failed"
          echo "Check the logs above for details"
