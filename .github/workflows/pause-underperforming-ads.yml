name: Pause Underperforming Ads

on:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual triggering

jobs:
  pause-underperforming-ads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Pause underperforming ads
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_CAMPAIGN_IDS: ${{ secrets.META_CAMPAIGN_IDS }}
        run: |
          cd cron-jobs/pause_underperforming_ads
          go run main.go -result-action-type=start_trial_total -apply

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pause underperforming ads job failed"
          echo "Check the logs above for details"
