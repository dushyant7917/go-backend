name: Cleanup Old Posters

on:
  # Triggered externally on schedule via cron-job.org — GitHub's native `schedule:`
  # trigger was delayed by 1-10h and has been removed. See CRON_SCHEDULE.md.
  # Previous cron: "30 2 * * 1" (8:00 AM IST every Monday)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  cleanup-old-posters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run cleanup script for posters older than 14 days
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DS_POSTERS_BUCKET_NAME: ${{ secrets.R2_DS_POSTERS_BUCKET_NAME }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          cd cron-jobs/cleanup_old_posters
          go run main.go 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "Cleanup script failed"
          echo "Check the logs above for details"
