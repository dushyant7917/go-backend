name: Parse News

on:
  # Triggered externally on schedule via cron-job.org — GitHub's native `schedule:`
  # trigger was delayed by 1-10h and has been removed. See CRON_SCHEDULE.md.
  # Previous cron(s): "30 0 * * *" (6:00 AM IST), "30 3 * * *" (9:00 AM IST),
  # "0 9 * * *" (2:30 PM IST). Each fires this same workflow (all 3 jobs run each time).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  parse-news-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run topic news parser
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEMANTIC_DEDUP_ENABLED: ${{ vars.SEMANTIC_DEDUP_ENABLED }}
          SEMANTIC_DEDUP_THRESHOLD: ${{ vars.SEMANTIC_DEDUP_THRESHOLD }}
          SEMANTIC_DEDUP_WINDOW_HOURS: ${{ vars.SEMANTIC_DEDUP_WINDOW_HOURS }}
        run: |
          cd cron-jobs/parse_news_topics
          go run main.go

      - name: Notify on failure
        if: failure()
        run: |
          echo "Topic news parser failed"
          echo "Check the logs above for details"

  parse-news-areas:
    runs-on: ubuntu-latest
    needs: [parse-news-topics]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run area news parser
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEMANTIC_DEDUP_ENABLED: ${{ vars.SEMANTIC_DEDUP_ENABLED }}
          SEMANTIC_DEDUP_THRESHOLD: ${{ vars.SEMANTIC_DEDUP_THRESHOLD }}
          SEMANTIC_DEDUP_WINDOW_HOURS: ${{ vars.SEMANTIC_DEDUP_WINDOW_HOURS }}
        run: |
          cd cron-jobs/parse_news_areas
          go run main.go

      - name: Notify on failure
        if: failure()
        run: |
          echo "Area news parser failed"
          echo "Check the logs above for details"

  generate-news-media:
    runs-on: ubuntu-latest
    needs: [parse-news-areas]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run generate news media
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          MODAL_ENQUEUE_URL: ${{ secrets.MODAL_ENQUEUE_URL }}
          MODAL_PROXY_AUTH_TOKEN_ID: ${{ secrets.MODAL_PROXY_AUTH_TOKEN_ID }}
          MODAL_PROXY_AUTH_TOKEN_SECRET: ${{ secrets.MODAL_PROXY_AUTH_TOKEN_SECRET }}
        run: |
          cd cron-jobs/generate_news_media
          go run main.go

      - name: Notify on failure
        if: failure()
        run: |
          echo "Generate news media failed"
          echo "Check the logs above for details"
