name: Cleanup Old Templates

on:
  schedule:
    # Runs at 3:30 AM IST (10:00 PM UTC previous day) every Monday
    - cron: "0 22 * * 1"
  workflow_dispatch: # Allows manual triggering

jobs:
  cleanup-old:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Download dependencies
        run: go mod download

      - name: Run cleanup script for templates older than 14 days
        env:
          GO_ENV: ${{ secrets.GO_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DS_TEMPLATES_BUCKET_NAME: ${{ secrets.R2_DS_TEMPLATES_BUCKET_NAME }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          cd cron-jobs/cleanup_old_templates
          go run main.go 14

      - name: Notify on failure
        if: failure()
        run: |
          echo "Cleanup script failed"
          echo "Check the logs above for details"
